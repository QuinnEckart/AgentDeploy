name: agentdeploy-prototype
region: nyc
services:
  - name: agentdeploy
    image:
      registry_type: DOCR
      registry: agentdeploy
      repository: prototype
      digest: ${IMAGE_DIGEST}
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
ingress:
  rules:
    - match:
        path:
          prefix: /
      component:
        name: agentdeploy
