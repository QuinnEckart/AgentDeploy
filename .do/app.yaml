name: agentdeploy-prototype
region: nyc
features:
  - buildpack-stack=ubuntu-22
static_sites:
  - name: agentdeploy
    github:
      repo: QuinnEckart/AgentDeploy
      branch: app-platform-deploy
      deploy_on_push: false
    build_command: npm run build
    output_dir: dist
    environment_slug: node-js
ingress:
  rules:
    - match:
        path:
          prefix: /
      component:
        name: agentdeploy
